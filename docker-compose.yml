services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boxadmin
      POSTGRES_PASSWORD: boxadmin_dev
      POSTGRES_DB: boxadmin
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boxadmin -d boxadmin"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boxadmin
      POSTGRES_PASSWORD: boxadmin_dev
      POSTGRES_DB: boxadmin_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boxadmin -d boxadmin_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.dev
    env_file: .env
    # Los volúmenes anónimos de node_modules (abajo) sobreviven a cada
    # recreación del contenedor y tapan el node_modules de la imagen nueva: tras
    # un cambio de dependencias, `docker compose up -d --build api` (sin -V)
    # arrancaba con el node_modules viejo y moría con
    # «Cannot find module '@nestjs/throttler'». Por eso el arranque reconcilia
    # primero ese node_modules con el lockfile de la imagen:
    # - `pnpm install --frozen-lockfile --offline` sale sólo del store de pnpm
    #   que trae la imagen (instalado con ese mismo lockfile), sin red. Si no
    #   hay nada que cambiar tarda ~1 s, y reparar una dependencia que falta,
    #   también ~1 s (medido en la Fase 20).
    # - `prisma generate`, porque el cliente generado vive en
    #   node_modules/.prisma, dentro del mismo volumen anónimo.
    # Se eligió esto antes que documentar `up -V`, porque así no depende de
    # que alguien se acuerde del flag.
    command:
      - sh
      - -c
      - >-
        cd /repo &&
        pnpm install --frozen-lockfile --offline &&
        pnpm --filter @boxadmin/api exec prisma generate &&
        cd apps/api &&
        exec pnpm start:dev
    environment:
      DATABASE_URL: postgresql://boxadmin:boxadmin_dev@postgres:5432/boxadmin?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/repo/apps/api
      - ./packages/shared:/repo/packages/shared
      - /repo/node_modules
      - /repo/apps/api/node_modules
      - /repo/packages/shared/node_modules

volumes:
  pgdata:
